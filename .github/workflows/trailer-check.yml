name: AI-Attribution trailer check

on:
  pull_request:

# Newest push to a pull request wins. This check is quick, but a superseded
# run still occupies a slot and reports on code that has been replaced.
concurrency:
  group: trailer-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-go@v5
        with:
          # Read from go.mod so a toolchain bump cannot leave CI behind:
          # pinning a literal here is how this ended up on 1.22 while
          # go.mod required 1.26.5, which CI could not build at all.
          go-version-file: go.mod

      - name: Build dun
        run: go build -o /usr/local/bin/dun ./cmd/dun

      - name: Check trailers
        run: dun check --base "origin/${{ github.base_ref }}"
