name: Release

# Two triggers, deliberately.
#
# A tag pushed by hand still releases, which is the escape hatch when
# something needs cutting outside the normal flow. But a tag pushed by
# tag-on-prd.yml cannot start this workflow: GitHub does not fire workflow
# events for anything GITHUB_TOKEN created, to stop workflows looping. So
# that job calls this one instead, and passes the tag it just created.
on:
  push:
    tags:
      - "v*"
  workflow_call:
    inputs:
      tag:
        description: The tag to build and publish.
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref_name }}

      # One name for the tag whichever way the workflow started.
      - name: Resolve the tag
        id: t
        run: echo "tag=${{ inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      # Resolve the tag rather than trusting GITHUB_SHA: on a workflow_call
      # that is the caller's commit, not the commit being released.
      - name: Require tag to be on PRD
        run: |
          tag='${{ steps.t.outputs.tag }}'
          git fetch --quiet origin PRD
          sha=$(git rev-list -n1 "$tag")
          if ! git merge-base --is-ancestor "$sha" origin/PRD; then
            echo "::error::Tag ${tag} is not on PRD - releases are only cut from PRD."
            exit 1
          fi

      - uses: actions/setup-go@v5
        with:
          # Read from go.mod so a toolchain bump cannot leave CI behind:
          # pinning a literal here is how this ended up on 1.22 while
          # go.mod required 1.26.5, which CI could not build at all.
          go-version-file: go.mod

      # nfpm turns the Linux binaries into a .deb and an .rpm per
      # architecture (see nfpm.yaml). Pinned: a floating @latest here would
      # let a packager change alter a release without a commit saying so.
      - name: Install nfpm
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.47.0

      - name: Build release artifacts
        run: ./scripts/release.sh "${{ steps.t.outputs.tag }}"

      # Dashboards ship with the release so a team can import them without
      # cloning the repository or running the bundled DevLake stack.
      - name: Bundle dashboards
        run: |
          deploy/devlake/export-dashboards.py --check
          tar -czf "dist/whodunit_dashboards_${{ steps.t.outputs.tag }}.tar.gz" \
            -C deploy/devlake/dashboards-import .

      # The release notes are the CHANGELOG's own section for this tag.
      #
      # --generate-notes was used before, and it produces a list of merged
      # pull requests: for 0.6.1 that was one line reading "Release 0.6.1"
      # with a link to the PR. Everything a reader actually needed — which
      # bug, measured how, what still does not work — was already written in
      # CHANGELOG.md and published nowhere.
      #
      # Extracted rather than duplicated, so the two cannot disagree. If the
      # section is missing the release still publishes, with generated notes
      # and a warning: a notes problem must not fail a release whose
      # artifacts are already built.
      - name: Extract the release notes from CHANGELOG.md
        id: notes
        run: |
          version="${{ steps.t.outputs.tag }}"
          version="${version#v}"
          if awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > /tmp/notes.md && [ -s /tmp/notes.md ]; then
            printf '\n---\n\n**Full changelog**: https://github.com/%s/compare/%s...%s\n' \
              "${{ github.repository }}" "$(git describe --tags --abbrev=0 "${{ steps.t.outputs.tag }}^" 2>/dev/null || echo '')" \
              "${{ steps.t.outputs.tag }}" >> /tmp/notes.md
            echo "have_notes=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No CHANGELOG section for $version; falling back to generated notes."
            echo "have_notes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.notes.outputs.have_notes }}" = "true" ]; then
            gh release create "${{ steps.t.outputs.tag }}" dist/dun_* dist/whodunit_dashboards_* dist/checksums.txt \
              --title "${{ steps.t.outputs.tag }}" --notes-file /tmp/notes.md
          else
            gh release create "${{ steps.t.outputs.tag }}" dist/dun_* dist/whodunit_dashboards_* dist/checksums.txt \
              --title "${{ steps.t.outputs.tag }}" --generate-notes
          fi

  # Publishing to the package managers, which used to be two manual steps.
  #
  # They were manual because pushing to a second repository needs a token
  # GITHUB_TOKEN cannot provide, and that was judged a larger decision than
  # a hand-edit. Automating the release itself changed the trade: a release
  # now cuts itself on a PRD merge, so the manual step that used to sit
  # beside a manual release has nothing prompting it. v0.3.1 shipped while
  # the tap stayed on 0.3.0, and `brew upgrade dun` correctly reported
  # nothing to do.
  #
  # PACKAGING_TOKEN is a fine-grained PAT with contents:write on
  # navjyotnishant/homebrew-tap and navjyotnishant/scoop-bucket and nothing
  # else. Absent, this job is skipped and the release still publishes -
  # degrading rather than failing a release over packaging.
  publish-packages:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve the tag
        id: t
        run: echo "tag=${{ inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      # Absent and expired are different failures and must not look the same.
      #
      # No token is a choice - a fork, or an install that does not publish -
      # so it warns and skips. An expired or under-scoped token is a broken
      # setup someone meant to work, and skipping quietly would let the tap
      # lag for months with only a warning nobody reads. A fine-grained PAT
      # expires within a year by construction, so this is on a timer rather
      # than hypothetical.
      #
      # Probing both repositories rather than one: repository access is
      # granted per repository, so a token can be valid for the tap and
      # missing the bucket entirely.
      - name: Check for the packaging token
        id: tok
        env:
          PACKAGING_TOKEN: ${{ secrets.PACKAGING_TOKEN }}
        run: |
          if [ -z "$PACKAGING_TOKEN" ]; then
            echo "::warning::PACKAGING_TOKEN not set - Homebrew and Scoop not updated for ${{ steps.t.outputs.tag }}. Publish by hand with scripts/brew-formula.sh and scripts/scoop-manifest.sh."
            echo "present=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          fail=0
          for repo in navjyotnishant/homebrew-tap navjyotnishant/scoop-bucket; do
            # gh prints the error body to stdout and still exits non-zero,
            # so the call is captured separately from the fallback: an
            # inline `|| echo` appends to the JSON rather than replacing it,
            # and every failure then reads as "no write access".
            if ! push=$(GH_TOKEN="$PACKAGING_TOKEN" gh api "repos/$repo" \
                          --jq .permissions.push 2>/dev/null); then
              push=unreachable
            fi
            case "$push" in
              true) ;;
              unreachable)
                echo "::error::PACKAGING_TOKEN cannot read $repo - expired, revoked, or the repository is not in its access list."
                fail=1 ;;
              *)
                echo "::error::PACKAGING_TOKEN has no write access to $repo - grant Contents: Read and write."
                fail=1 ;;
            esac
          done
          [ "$fail" -eq 0 ] || exit 1

          echo "present=true" >> "$GITHUB_OUTPUT"

      # From the published release rather than a rebuild: the manifests must
      # describe what was actually published, and a rebuild could differ.
      - name: Fetch the release checksums
        if: steps.tok.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          gh release download "${{ steps.t.outputs.tag }}" -p checksums.txt -D dist

      - name: Update the Homebrew tap
        if: steps.tok.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ secrets.PACKAGING_TOKEN }}
        run: |
          tag='${{ steps.t.outputs.tag }}'
          git clone --depth 1 \
            "https://x-access-token:${GH_TOKEN}@github.com/navjyotnishant/homebrew-tap.git" tap
          ./scripts/brew-formula.sh "$tag" dist > tap/Formula/dun.rb
          cd tap
          if git diff --quiet; then
            echo "::notice::Formula already at ${tag}."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "dun ${tag}"
          git push

      # The Windows archives are needed to read the shim name from inside
      # them; without them scoop-manifest.sh falls back to an assumed name.
      - name: Update the Scoop bucket
        if: steps.tok.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ secrets.PACKAGING_TOKEN }}
        run: |
          tag='${{ steps.t.outputs.tag }}'
          GH_TOKEN='${{ github.token }}' gh release download "$tag" \
            -p 'dun_*_windows_*.zip' -D dist
          git clone --depth 1 \
            "https://x-access-token:${GH_TOKEN}@github.com/navjyotnishant/scoop-bucket.git" bucket
          ./scripts/scoop-manifest.sh "$tag" dist > bucket/bucket/dun.json
          cd bucket
          if git diff --quiet; then
            echo "::notice::Manifest already at ${tag}."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "dun ${tag}"
          git push

  # The documentation site is a separate repository (navjyotnishant/njlabs)
  # and this workflow has no token for it, so the docs release cannot run
  # from here. It can say so, which is the difference between a step someone
  # forgets and a step someone is reminded of.
  #
  # 0.6.1 shipped with the docs still serving 0.6.0 at the root: the version
  # was cut, listed in the dropdown, and was not what anyone landed on.
  remind-docs:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Docs release is still manual
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          echo "::notice title=Docs release::Run ./release-docs.sh ${tag#v} in navjyotnishant/njlabs/whodunit — cutting the snapshot alone leaves the site serving the previous version."
