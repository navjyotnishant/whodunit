name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require tag to be on PRD
        run: |
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/PRD; then
            echo "::error::Tag ${GITHUB_REF_NAME} is not on PRD - releases are only cut from PRD."
            exit 1
          fi

      - uses: actions/setup-go@v5
        with:
          # Read from go.mod so a toolchain bump cannot leave CI behind:
          # pinning a literal here is how this ended up on 1.22 while
          # go.mod required 1.26.5, which CI could not build at all.
          go-version-file: go.mod

      - name: Build release artifacts
        run: ./scripts/release.sh "${GITHUB_REF_NAME}"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/dun_* dist/checksums.txt \
            --title "${GITHUB_REF_NAME}" --generate-notes
