<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420">
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#080c12"/>
    </linearGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#222b36"/>
      <stop offset="100%" stop-color="#1a222c"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="drop" x="-10%" y="-14%" width="120%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="1000" height="420" fill="url(#page)"/>
  <!-- faint accent wash, top-right -->
  <circle cx="880" cy="40" r="190" fill="#25c2a0" opacity="0.055"/>

  <!-- ================= terminal window ================= -->
  <g filter="url(#drop)">
    <rect x="44" y="34" width="912" height="326" rx="11" fill="#0b0f15" stroke="#2b3542" stroke-width="1.5"/>
    <!-- chrome bar -->
    <path d="M44 45 a11 11 0 0 1 11-11 h890 a11 11 0 0 1 11 11 v23 h-912 z" fill="url(#chrome)"/>
    <circle cx="68"  cy="56" r="5.5" fill="#ff5f57"/>
    <circle cx="88"  cy="56" r="5.5" fill="#febc2e"/>
    <circle cx="108" cy="56" r="5.5" fill="#28c840"/>
    <text x="500" y="60" fill="#7c8794" font-size="12"
          font-family="SF Mono, Menlo, Consolas, monospace" text-anchor="middle">dun</text>
  </g>

  <!-- ================= terminal content ================= -->
  <g font-family="SF Mono, Menlo, Consolas, monospace" font-size="15.5">

    <!-- figlet wordmark, copied verbatim from real `dun` output -->
    <g fill="#e8edf3" filter="url(#glow)" font-size="15.5" xml:space="preserve">
      <text x="76" y="108">           _               _             _ _ </text>
      <text x="76" y="126"> __      _| |__   ___   __| |_   _ _ __ (_) |_</text>
      <text x="76" y="144"> \ \ /\ / / '_ \ / _ \ / _` | | | | '_ \| | __|</text>
      <text x="76" y="162">  \ V  V /| | | | (_) | (_| | |_| | | | | | |_</text>
      <text x="76" y="180">   \_/\_/ |_| |_|\___/ \__,_|\__,_|_| |_|_|\__|</text>
    </g>

    <!-- version line -->
    <text x="76" y="218" xml:space="preserve"><tspan fill="#f2f5f8" font-weight="700">whodunit</tspan><tspan fill="#6f7b8a">  v0.3.0</tspan><tspan fill="#8b96a6">   — AI adoption, measured against what shipped</tspan></text>

    <!-- command list, two columns -->
    <g font-size="14.5" xml:space="preserve">
      <text x="76" y="256"><tspan fill="#25c2a0" font-weight="700">init</tspan><tspan fill="#7a8593">      install the git hooks</tspan></text>
      <text x="76" y="280"><tspan fill="#25c2a0" font-weight="700">status</tspan><tspan fill="#7a8593">    trailer coverage and method mix</tspan></text>
      <text x="76" y="304"><tspan fill="#25c2a0" font-weight="700">report</tspan><tspan fill="#7a8593">    self-contained HTML, no server</tspan></text>

      <text x="546" y="256"><tspan fill="#25c2a0" font-weight="700">verify</tspan><tspan fill="#7a8593">    attribution actually working</tspan></text>
      <text x="546" y="280"><tspan fill="#25c2a0" font-weight="700">delta</tspan><tspan fill="#7a8593">     before and after adoption</tspan></text>
      <text x="546" y="304"><tspan fill="#25c2a0" font-weight="700">sync</tspan><tspan fill="#7a8593">      send to a shared database</tspan></text>
    </g>

    <!-- prompt. xml:space preserved so the gap after $ survives -->
    <text x="76" y="336" font-size="14.5" xml:space="preserve"><tspan fill="#25c2a0">$</tspan><tspan fill="#c6ced9">  dun status</tspan><tspan fill="#25c2a0">▌</tspan></text>
  </g>

  <!-- ================= strapline under the window ================= -->
  <text x="46" y="392" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="19" font-weight="600" fill="#c6ced9">AI attribution in git trailers</text>
  <text x="352" y="392" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="19" fill="#5c6675">— and the one number it refuses to report</text>
</svg>
