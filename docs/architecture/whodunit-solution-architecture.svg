<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 840" role="img" aria-labelledby="title desc">
  <title id="title">whodunit solution architecture</title>
  <desc id="desc">Developer machines collect local git and AI agent evidence, stamp AI attribution trailers, keep a local journal, optionally render a local report, and optionally sync whodunit tables to DevLake and Grafana dashboards.</desc>
  <defs>
    <linearGradient id="blue" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#dbeafe"/>
      <stop offset="100%" stop-color="#bfdbfe"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#ffedd5"/>
      <stop offset="100%" stop-color="#fed7aa"/>
    </linearGradient>
    <linearGradient id="purple" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#ede9fe"/>
      <stop offset="100%" stop-color="#ddd6fe"/>
    </linearGradient>
    <linearGradient id="green" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#dcfce7"/>
      <stop offset="100%" stop-color="#bbf7d0"/>
    </linearGradient>
    <linearGradient id="gray" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#334155"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; fill: #0f172a; }
      .small { font-size: 18px; fill: #475569; }
      .tiny { font-size: 15px; fill: #64748b; }
      .label { font-size: 22px; font-weight: 700; }
      .title { font-size: 40px; font-weight: 800; }
      .subtitle { font-size: 20px; fill: #475569; }
      .band-title { font-size: 18px; font-weight: 700; fill: #334155; }
      .card { stroke: #cbd5e1; stroke-width: 2; rx: 22; filter: url(#shadow); }
      .band { fill: none; stroke: #cbd5e1; stroke-width: 2; stroke-dasharray: 8 8; rx: 28; }
      .arrow { fill: none; stroke: #334155; stroke-width: 3; marker-end: url(#arrow); }
      .dash { fill: none; stroke: #334155; stroke-width: 3; stroke-dasharray: 10 8; marker-end: url(#arrow); }
      .note { fill: #fff7ed; stroke: #fed7aa; stroke-width: 2; rx: 18; }
      .frame { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 34; }
      @media (prefers-color-scheme: dark) {
        .frame { fill: #020617; stroke: #334155; }
        .band { stroke: #475569; }
        .card { stroke: #475569; }
        text { fill: #e5e7eb; }
        .small, .subtitle { fill: #cbd5e1; }
        .tiny { fill: #94a3b8; }
        .band-title { fill: #cbd5e1; }
        .arrow, .dash { stroke: #cbd5e1; }
        #arrow path { fill: #cbd5e1; }
      }
    </style>
  </defs>

  <rect class="frame" x="24" y="24" width="1392" height="792"/>

  <text class="title" x="72" y="86">whodunit turns local AI evidence into honest adoption metrics</text>
  <text class="subtitle" x="72" y="120">Local-first collection; attribution travels with git; shared dashboards are optional.</text>

  <rect class="band" x="58" y="158" width="780" height="510"/>
  <text class="band-title" x="84" y="190">Developer machine - local evidence boundary</text>

  <rect class="band" x="884" y="158" width="476" height="510"/>
  <text class="band-title" x="910" y="190">Optional shared analytics layer</text>

  <rect class="card" x="92" y="235" width="210" height="120" fill="url(#gray)"/>
  <text class="label" x="122" y="278">Git repository</text>
  <text class="small" x="122" y="310">commits, staged diff,</text>
  <text class="small" x="122" y="336">existing hooks</text>

  <path d="M410,235 L560,235 L608,295 L560,355 L410,355 L362,295 Z" fill="url(#orange)" stroke="#fdba74" stroke-width="2" filter="url(#shadow)"/>
  <text class="label" x="412" y="278">AI agent logs</text>
  <text class="small" x="410" y="310">Claude Code, Codex,</text>
  <text class="small" x="430" y="336">agy transcripts</text>

  <rect class="card" x="232" y="430" width="260" height="126" fill="url(#blue)"/>
  <text class="label" x="270" y="474">dun CLI + hooks</text>
  <text class="small" x="262" y="508">init, ingest, daemon,</text>
  <text class="small" x="292" y="534">commit stamping</text>

  <rect class="card" x="580" y="430" width="210" height="126" fill="url(#purple)"/>
  <text class="label" x="632" y="474">Local journal</text>
  <text class="small" x="625" y="508">SQLite under</text>
  <text class="small" x="626" y="534">~/.whodunit</text>

  <rect class="card" x="574" y="235" width="220" height="120" fill="url(#green)"/>
  <text class="label" x="616" y="278">Git trailer</text>
  <text class="small" x="608" y="310">AI-Attribution</text>
  <text class="small" x="612" y="336">travels with commit</text>

  <rect class="card" x="600" y="586" width="190" height="74" fill="url(#green)"/>
  <text class="label" x="642" y="630">Local report</text>

  <rect class="card" x="925" y="250" width="190" height="108" fill="url(#purple)"/>
  <text class="label" x="970" y="292">DevLake DB</text>
  <text class="small" x="958" y="324">whodunit_* tables</text>

  <rect class="card" x="1138" y="250" width="178" height="108" fill="url(#green)"/>
  <text class="label" x="1184" y="292">Grafana</text>
  <text class="small" x="1172" y="324">adoption, cost,</text>
  <text class="small" x="1177" y="348">delivery views</text>

  <rect class="card" x="1010" y="470" width="228" height="112" fill="url(#gray)"/>
  <text class="label" x="1054" y="512">Delivery data</text>
  <text class="small" x="1042" y="544">PRs, deployments,</text>
  <text class="small" x="1078" y="570">issues</text>

  <path class="arrow" d="M302 295 C340 314, 196 405, 248 447"/>
  <path class="arrow" d="M362 295 C330 330, 332 390, 354 430"/>
  <path class="arrow" d="M492 493 L580 493"/>
  <path class="arrow" d="M492 456 C540 392, 584 366, 624 355"/>
  <path class="arrow" d="M685 556 L690 586"/>
  <path class="dash" d="M790 493 C850 464, 878 394, 936 346"/>
  <path class="arrow" d="M1115 304 L1138 304"/>
  <path class="arrow" d="M1124 470 L1124 390 C1124 370, 1142 350, 1166 340"/>

  <rect class="note" x="86" y="700" width="392" height="76"/>
  <text class="label" x="112" y="732">Privacy posture</text>
  <text class="small" x="112" y="762">No prompt text or file contents in the journal.</text>

  <rect class="note" x="504" y="700" width="420" height="76"/>
  <text class="label" x="546" y="732">Metric posture</text>
  <text class="small" x="546" y="762">Missing evidence stays absent, not zero.</text>

  <rect class="note" x="950" y="700" width="380" height="76"/>
  <text class="label" x="980" y="732">Dashboard posture</text>
  <text class="small" x="980" y="762">Shared reporting is opt-in via dun sync.</text>

  <rect x="878" y="104" width="18" height="18" rx="4" fill="url(#blue)" stroke="#93c5fd"/>
  <text class="tiny" x="906" y="118">local tool</text>
  <rect x="996" y="104" width="18" height="18" rx="4" fill="url(#orange)" stroke="#fdba74"/>
  <text class="tiny" x="1024" y="118">agent evidence</text>
  <rect x="1164" y="104" width="18" height="18" rx="4" fill="url(#purple)" stroke="#c4b5fd"/>
  <text class="tiny" x="1192" y="118">stored data</text>
  <rect x="1298" y="104" width="18" height="18" rx="4" fill="url(#green)" stroke="#86efac"/>
  <text class="tiny" x="1326" y="118">output</text>
</svg>
