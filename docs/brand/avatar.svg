<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <rect width="512" height="512" fill="#0d1117"/>
  <!-- GitHub renders an avatar in a CIRCLE in most places and a rounded
       square in others, so the mark is inset well inside both. At 512 the
       safe circle is ~r=230; the mark spans 240 wide, centred. -->
  <g transform="translate(256,256) scale(3.8) translate(-32,-32)">
    <circle cx="23" cy="32" r="19" fill="#25c2a0" opacity="0.3"/>
    <circle cx="41" cy="32" r="19" fill="#25c2a0" opacity="0.3"/>
    <path d="M32,14.3 A19,19 0 0 1 32,49.7 A19,19 0 0 1 32,14.3 Z" fill="#25c2a0"/>
  </g>
</svg>
